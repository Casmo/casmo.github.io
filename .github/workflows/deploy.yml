# Builds the Statamic site to static HTML and deploys it to GitHub Pages.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs so that "Re-run failed jobs" after a
  # failed deploy only re-runs the deploy. With a single job every re-run
  # uploaded another "github-pages" artifact to the same run, and deploy-pages
  # then refuses to pick one ("Multiple artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Setup npm
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install npm dependencies
        run: |
          npm install
          npm run build
      - name: Build static assets
        run: |
          cp .env.example .env
          php artisan key:generate
          php please ssg:generate
        env:
          APP_ENV: production
          APP_URL: https://mathieuderuiter.nl
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # v4+ leaves dotfiles out of the artifact; the site has none it needs
      # (.htaccess, .gitkeep and Statamic .meta files only).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'storage/static'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
