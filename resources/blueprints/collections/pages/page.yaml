title: Page
template: '@blueprint'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: content
            field:
              type: markdown
              display: Content
              localizable: true
          -
            handle: template
            field:
              blueprint: true
              type: template
              display: Template
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: terminal_path
            field:
              type: text
              display: 'Terminal path'
              instructions: 'Optional. Overrides the prompt path, which defaults to the page title (About -> ~/about).'
          -
            handle: terminal_file
            field:
              type: text
              display: 'Terminal filename'
              instructions: 'Optional. Overrides the file being cat''d, which defaults to the slug (e.g. introduction.txt).'
